description: Marketing and documentation site for Spektacular (spektacular.dev), built with Astro 5 and Tailwind CSS v4 — includes the configuration and workflow reference docs
role: documentation
tags:
    - docs
    - website
    - astro
deployment: static-site
knowledge:
    sources:
        - scope: project
          provider: file
          config:
            location: .spektacular/knowledge
changelog:
    provider: file
    config:
        directory: .spektacular/changelog
